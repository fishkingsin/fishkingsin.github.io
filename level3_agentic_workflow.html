<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 3: Agentic Workflow</title>
<style>
  :root {
    --bg-dark: #050914;
    --panel-bg: #0f172a;
    --cyan: #06b6d4;
    --blue: #3b82f6;
    --green: #10b981;
    --pink: #ec4899;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }
  
  body {
    margin: 0; 
    padding: 0; 
    background-color: var(--bg-dark); 
    color: var(--text-main); 
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh;
    overflow: hidden;
  }

  .container {
    width: 100vw; 
    max-width: 1200px; 
    aspect-ratio: 16/9; 
    position: relative; 
    background: var(--bg-dark); 
    box-shadow: 0 0 50px rgba(6, 182, 212, 0.05);
  }

  /* Cyber Grid Background */
  .container::before {
    content: ""; 
    position: absolute; 
    inset: 0;
    background-image: 
      linear-gradient(rgba(6, 182, 212, 0.1) 1px, transparent 1px), 
      linear-gradient(90deg, rgba(6, 182, 212, 0.1) 1px, transparent 1px);
    background-size: 40px 40px; 
    opacity: 0.4; 
    z-index: 0;
  }

  svg { 
    width: 100%; 
    height: 100%; 
    position: relative; 
    z-index: 1; 
  }

  /* Animations */
  .data-stream {
    stroke: var(--cyan); 
    stroke-width: 2.5; 
    fill: none;
    stroke-dasharray: 12 12; 
    animation: flow 1.5s linear infinite;
  }
  .data-stream.feedback {
    stroke: var(--pink);
    stroke-dasharray: 6 18;
    animation: flow-reverse 2s linear infinite;
  }
  
  @keyframes flow { 
    to { stroke-dashoffset: -24; } 
  }
  @keyframes flow-reverse { 
    to { stroke-dashoffset: 24; } 
  }

  .pulse-glow { 
    animation: pulseGlow 2.5s infinite alternate; 
  }
  @keyframes pulseGlow {
    0% { filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.4)); }
    100% { filter: drop-shadow(0 0 25px rgba(6, 182, 212, 0.9)); }
  }

  /* Node Styling */
  .node-rect { 
    fill: rgba(15, 23, 42, 0.85); 
    stroke: var(--blue); 
    stroke-width: 2; 
    rx: 8; 
    backdrop-filter: blur(4px);
  }
  .node-rect.orchestrator { stroke: var(--cyan); stroke-width: 3; }
  .node-rect.human { stroke: var(--green); }

  .text-title { fill: var(--text-main); font-size: 18px; font-weight: 700; text-anchor: middle; letter-spacing: 0.5px;}
  .text-desc { fill: var(--text-muted); font-size: 14px; text-anchor: middle; }
  .text-highlight { fill: var(--cyan); font-size: 14px; text-anchor: middle; font-weight: 500;}
  
  .header-title { fill: var(--cyan); font-size: 34px; font-weight: 800; letter-spacing: 3px; }
  .header-subtitle { fill: var(--text-muted); font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase;}
  
  .department-badge { fill: var(--blue); font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="container">
  <svg viewBox="0 0 1200 675">
    <defs>
      <!-- Glow filter for Orchestrator & Title -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      <!-- Arrowheads -->
      <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4" />
      </marker>
      <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899" />
      </marker>
      <marker id="arrow-pink-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 10 0 L 0 5 L 10 10 z" fill="#ec4899" />
      </marker>
    </defs>

    <!-- Header Section -->
    <text x="60" y="70" class="header-title" filter="url(#glow)">LEVEL 3: AGENTIC WORKFLOW</text>
    <text x="63" y="100" class="header-subtitle">Kingsin AI Company Model • Autonomous Orchestration</text>

    <!-- Connectors (Forward) -->
    <!-- Human to Orchestrator -->
    <path class="data-stream" d="M 280 337 L 430 337" marker-end="url(#arrow-cyan)"/>
    
    <!-- Orchestrator to Departments -->
    <!-- To Eng -->
    <path class="data-stream" d="M 670 300 L 760 300 L 760 140 L 860 140" marker-end="url(#arrow-cyan)"/>
    <!-- To Content -->
    <path class="data-stream" d="M 670 320 L 730 320 L 730 250 L 860 250" marker-end="url(#arrow-cyan)"/>
    <!-- To Design -->
    <path class="data-stream" d="M 670 337 L 860 337" marker-end="url(#arrow-cyan)"/>
    <!-- To Translation -->
    <path class="data-stream" d="M 670 355 L 730 355 L 730 430 L 860 430" marker-end="url(#arrow-cyan)"/>
    <!-- To Admin -->
    <path class="data-stream" d="M 670 375 L 760 375 L 760 540 L 860 540" marker-end="url(#arrow-cyan)"/>

    <!-- Connectors (Feedback Loops) -->
    <!-- Eng Feedback -->
    <path class="data-stream feedback" d="M 670 280 L 780 280 L 780 160 L 860 160" marker-start="url(#arrow-pink)"/>
    <!-- Design Feedback -->
    <path class="data-stream feedback" d="M 670 360 L 860 360" marker-start="url(#arrow-pink)"/>
    <!-- Admin Feedback -->
    <path class="data-stream feedback" d="M 670 395 L 780 395 L 780 560 L 860 560" marker-start="url(#arrow-pink)"/>

    <!-- Annotations -->
    <text x="355" y="325" fill="#06b6d4" font-size="12" text-anchor="middle">Task Spec</text>
    <text x="710" y="270" fill="#ec4899" font-size="12" text-anchor="middle" transform="rotate(-90 710 270)">Code Review Loop</text>

    <!-- Node: Human Supervisor -->
    <g transform="translate(60, 287)">
      <rect width="220" height="100" class="node-rect human" />
      <text x="110" y="35" class="text-title" fill="#10b981">Human Supervisor</text>
      <text x="110" y="60" class="text-desc">Defines Goal & Constraints</text>
      <text x="110" y="80" class="text-desc">Final Approval (HITL)</text>
    </g>

    <!-- Node: Orchestrator Agent -->
    <g transform="translate(430, 227)" class="pulse-glow">
      <rect width="240" height="220" class="node-rect orchestrator" />
      <!-- Icon/Symbol -->
      <circle cx="120" cy="50" r="24" fill="rgba(6, 182, 212, 0.1)" stroke="#06b6d4" stroke-width="2"/>
      <path d="M110 40 L130 50 L110 60 Z" fill="#06b6d4"/>
      
      <text x="120" y="105" class="text-title">Orchestrator Agent</text>
      <text x="120" y="125" class="text-highlight">Hermes CTO</text>
      
      <line x1="40" y1="140" x2="200" y2="140" stroke="#1e293b" stroke-width="1"/>
      
      <text x="120" y="165" class="text-desc">• Task Decomposition</text>
      <text x="120" y="185" class="text-desc">• Context Routing</text>
      <text x="120" y="205" class="text-desc">• Output Synthesis</text>
    </g>

    <!-- Worker Nodes -->
    <!-- Dept 1: Eng -->
    <g transform="translate(860, 100)">
      <rect width="240" height="80" class="node-rect" />
      <text x="120" y="25" class="department-badge">DEPT 01</text>
      <text x="120" y="45" class="text-title">Engineering</text>
      <text x="120" y="65" class="text-desc">Code Gen, Tests & PRs</text>
    </g>

    <!-- Dept 2: Content -->
    <g transform="translate(860, 200)">
      <rect width="240" height="80" class="node-rect" />
      <text x="120" y="25" class="department-badge">DEPT 02</text>
      <text x="120" y="45" class="text-title">Content</text>
      <text x="120" y="65" class="text-desc">Copywriting & SEO Strategy</text>
    </g>

    <!-- Dept 3: Design -->
    <g transform="translate(860, 300)">
      <rect width="240" height="80" class="node-rect" />
      <text x="120" y="25" class="department-badge">DEPT 03</text>
      <text x="120" y="45" class="text-title">Visual Design</text>
      <text x="120" y="65" class="text-desc">ComfyUI / Graphics Gen</text>
    </g>

    <!-- Dept 4: Translation -->
    <g transform="translate(860, 400)">
      <rect width="240" height="80" class="node-rect" />
      <text x="120" y="25" class="department-badge">DEPT 04</text>
      <text x="120" y="45" class="text-title">Translation</text>
      <text x="120" y="65" class="text-desc">EN/ZH Localization & Tone</text>
    </g>

    <!-- Dept 5: Admin -->
    <g transform="translate(860, 500)">
      <rect width="240" height="80" class="node-rect" />
      <text x="120" y="25" class="department-badge">DEPT 05</text>
      <text x="120" y="45" class="text-title">Administration</text>
      <text x="120" y="65" class="text-desc">Docs, Wiki & Ops Governance</text>
    </g>

    <!-- Legend -->
    <g transform="translate(60, 580)">
      <rect width="260" height="70" fill="rgba(15, 23, 42, 0.7)" stroke="#1e293b" rx="6"/>
      <line x1="20" y1="25" x2="60" y2="25" class="data-stream" />
      <text x="75" y="29" fill="#e2e8f0" font-size="13">Task Execution (Forward)</text>
      
      <line x1="20" y1="50" x2="60" y2="50" class="data-stream feedback" />
      <text x="75" y="54" fill="#e2e8f0" font-size="13">Agentic Iteration (Feedback)</text>
    </g>

  </svg>
</div>
</body>
</html>
